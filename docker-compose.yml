services:
  redis:
    image: redis:alpine
    container_name: realtime-redis
    ports:
      - "6379:6379"

  db:
    image: timescale/timescaledb:latest-pg14
    container_name: realtime-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realtime-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    env_file:
      - .env

  ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realtime-ingestion
    depends_on:
      - redis
      - db
    env_file:
      - .env
    command: python ingestion.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realtime-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  timescale_data: